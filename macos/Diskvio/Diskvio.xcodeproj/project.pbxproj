		4AF5A97530756F6F008B7DBA /* Build Rust FFI */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = "Build Rust FFI";
			shellPath = /bin/bash;
			shellScript = (
				"set -euo pipefail",
				"export PATH=\"$HOME/.cargo/bin:$PATH\"",
				"REPO_ROOT=\"$SRCROOT/../..\"",
				"PROFILE=debug",
				"if [ \"$CONFIGURATION\" = Release ]; then",
				"  PROFILE=release",
				"fi",
				"LIBRARIES=()",
				"for ARCH in $ARCHS; do",
				"  case \"$ARCH\" in",
				"    arm64) RUST_TARGET=aarch64-apple-darwin ;;",
				"    x86_64) RUST_TARGET=x86_64-apple-darwin ;;",
				"    *) echo \"Unsupported macOS architecture: $ARCH\" >&2; exit 1 ;;",
				"  esac",
				"  if [ \"$PROFILE\" = release ]; then",
				"    cargo build --manifest-path \"$REPO_ROOT/Cargo.toml\" -p diskvio-ffi --target \"$RUST_TARGET\" --release",
				"  else",
				"    cargo build --manifest-path \"$REPO_ROOT/Cargo.toml\" -p diskvio-ffi --target \"$RUST_TARGET\"",
				"  fi",
				"  LIBRARIES+=(\"$REPO_ROOT/target/$RUST_TARGET/$PROFILE/libdiskvio_ffi.a\")",
				"done",
				"mkdir -p \"$DERIVED_FILE_DIR\"",
				"if [ \"${#LIBRARIES[@]}\" -eq 1 ]; then",
				"  cp \"${LIBRARIES[0]}\" \"$DERIVED_FILE_DIR/libdiskvio_ffi.a\"",
				"else",
				"  lipo -create \"${LIBRARIES[@]}\" -output \"$DERIVED_FILE_DIR/libdiskvio_ffi.a\"",
				"fi",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

