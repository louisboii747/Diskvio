name: Lint and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27, macos-26-intel, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test workspace and documentation
        run: cargo test --workspace --locked

  macos:
    name: macOS app and Swift lint
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust for Apple Silicon and Intel
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Lint, test and build Debug and universal Release
        run: python3 scripts/check.py macos --universal
      - name: Upload Xcode test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-results
          path: target/ci/Debug.xcresult
          if-no-files-found: ignore
          retention-days: 7

  swift-intel:
    name: Swift model tests (Intel)
    runs-on: macos-26-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test presentation and contracts with compiler warnings denied
        run: python3 scripts/check.py swift

  windows:
    name: Windows x64 app, analyzers and tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
          vs-version: '[18.0,19.0)'
      - name: Set up Rust for Windows x64
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
      - name: Analyze, build Debug and Release MSIX, and run fixture and read-only native tests
        run: python scripts/check.py windows --native-integration
      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: target/ci/windows/*.trx
          if-no-files-found: ignore
          retention-days: 7
